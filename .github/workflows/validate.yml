name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate repository contract
        run: python3 scripts/check_repo.py
      - name: Run tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
